services:
  minimizer:
    build: .
    image: json-schema-minimizer:latest
    container_name: json-schema-minimizer
    ports:
      # 宿主机 ${HOST_PORT:-8000} -> 容器 8000
      - "${HOST_PORT:-8000}:8000"
    environment:
      # 单条请求允许省略 max_evaluations 时使用的默认预算
      DEFAULT_MAX_EVALUATIONS: "${DEFAULT_MAX_EVALUATIONS:-1000}"
      # 服务端允许的最大预算 (防滥用)
      MAX_BUDGET_LIMIT: "${MAX_BUDGET_LIMIT:-100000}"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
